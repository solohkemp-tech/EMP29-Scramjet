name: EMP29
on:
  push:
    paths: ['emp29/**', 'packages/**', 'brand/**', 'licenses/**', '*.md', '.github/workflows/emp29.yml']
  pull_request:
    paths: ['emp29/**', 'packages/**', 'brand/**', 'licenses/**', '*.md', '.github/workflows/emp29.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: emp29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: emp29/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: python3 scripts/package-release.py --output "$RUNNER_TEMP/EMP29_Scramjet_v2.1.0.zip"
      - run: npm run doctor
      - uses: actions/upload-artifact@v4
        with:
          name: EMP29-Pro-2.1.0
          path: ${{ runner.temp }}/EMP29_Scramjet_v2.1.0.zip
